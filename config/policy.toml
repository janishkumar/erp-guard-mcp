# erp-guard policy. Amounts are in the company currency.

[approval.purchase_order]
# An order needs an approver whose tier limit covers its total. Ordered low to high.
# Purchase requests use these tiers too.
tiers = [
  { name = "manager",  limit = 50000 },
  { name = "director", limit = 250000 },
  { name = "cfo",      limit = 1e12 },
]

[approval.purchase_invoice]
tiers = [
  { name = "controller", limit = 250000 },
  { name = "cfo",        limit = 1e12 },
]

[approval.payment]
tiers = [
  { name = "manager",  limit = 50000 },
  { name = "director", limit = 250000 },
  { name = "cfo",      limit = 1e12 },
]

[request]
# Total from which a purchase request is required.
required_from = 5000

[quotes]
threshold = 25000
count = 3
lookback_days = 90

[receipt]
over_receipt_pct = 5

[invoice]
price_tolerance_pct = 2
duplicate_amount_days = 30
near_days = 14
near_pct = 0.5

[payment]
duplicate_days = 30
new_supplier_days = 90
bank_account = "Demo Operating Bank - LDU"

[generic]
# Document types that need a second person to confirm.
second_person = []

[split]
# Live orders to the same supplier and cost centre within this many days are summed.
window_days = 14

[price]
warn_above_pct = 10
block_above_pct = 50

[duplicate_supplier]
warn_token_set_ratio = 90

[fiscal_year]
start_month = 1

[confirmation]
ttl_minutes = 15

# Users, their policy roles, and the approval tier they hold per document kind.
# Anyone not listed can request but not approve.
[users]
"requester@example.com"  = { roles = ["requester"] }
"requester2@example.com" = { roles = ["requester"] }
"manager@example.com"    = { roles = ["approver"], purchase_order = "manager", payment = "manager" }
"director@example.com"   = { roles = ["approver"], purchase_order = "director", payment = "director", purchase_invoice = "controller" }
"receiver@example.com"   = { roles = ["receiver"] }
"ap@example.com"         = { roles = ["ap"] }
"controller@example.com" = { roles = ["controller"], purchase_invoice = "controller" }
"treasury@example.com"   = { roles = ["treasury"] }
