[project]
name = "erp-guard-mcp"
version = "0.1.0"
description = "MCP server for procure-to-pay writes in an ERP, with duplicate-supplier, split-purchase, budget, price and segregation-of-duties checks enforced in code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Janish Kumar" }]
keywords = ["mcp", "model-context-protocol", "procure-to-pay", "erp", "erpnext", "sap",
            "s4hana", "purchase-order", "internal-controls", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
seed = ["pandas>=2.2", "pyarrow>=17"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/janishkumar/erp-guard-mcp"
Source = "https://github.com/janishkumar/erp-guard-mcp"

[project.scripts]
erp-guard-mcp = "erp_guard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_guard"]

[tool.hatch.build.targets.wheel.force-include]
"config/policy.toml" = "erp_guard/policy.toml"

[tool.hatch.build.targets.sdist]
include = ["src/erp_guard", "config", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs the local ERPNext from `make up` (skipped otherwise)"]
